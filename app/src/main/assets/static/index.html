<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Photo Galaxy</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<footer id="bar">
  <div id="topStatus">
    <span class="brand">📷 Photo Galaxy</span>
    <span id="stats">불러오는 중...</span>
  </div>
  <div class="bar-row">
    <div class="mode-group" id="modeGroup" title="분류 기준 선택">
      <button type="button" class="mode-btn active" data-mode="folder">폴더별</button>
      <button type="button" class="mode-btn" data-mode="month">연·월별</button>
      <button type="button" class="mode-btn" data-mode="day">일별</button>
    </div>

    <div class="thumb-wrap">
      <button type="button" id="btnThumbCfg" title="썸네일 표시 기준 수량 설정">🖼️ <span id="thumbVal">100</span>개</button>
      <div id="thumbPop" hidden>
        <div class="tp-title">화면에 보이는 사진이 <b><span id="tpCur">100</span>개 이하</b>일 때 썸네일 표시</div>
        <div class="tp-presets">
          <button type="button" data-v="100">100개</button>
          <button type="button" data-v="200">200개</button>
          <button type="button" data-v="300">300개</button>
          <button type="button" data-v="400">400개</button>
          <button type="button" data-v="500">500개</button>
        </div>
        <div class="tp-custom">
          <span class="tp-label">임의설정</span>
          <button type="button" id="tpMinus" title="100개 감소">−100</button>
          <input id="tpInput" type="number" min="1" max="5000" step="10" value="100" aria-label="임의 수량 입력">
          <button type="button" id="tpPlus" title="100개 증가">+100</button>
        </div>
        <div class="tp-row">
          <input id="tpRange" type="range" min="50" max="1000" step="50" value="100">
        </div>
      </div>
    </div>

    <button type="button" id="btnFolder" title="다른 사진 폴더 열기">📁 폴더</button>
    <button type="button" id="btnFit" title="전체 보기 (Home)">전체</button>
    <button type="button" id="btnRescan" title="폴더를 다시 스캔">새로고침</button>

    <div class="search-wrap">
      <input id="search" type="search" placeholder="폴더·연도 검색 (예: 2019, 제주)" autocomplete="off">
      <ul id="results" hidden></ul>
    </div>
  </div>
  <div id="help">휠/두손가락: 확대·축소 · 드래그: 이동 · 클릭/탭: 열기 · 우클릭/길게누르기: 대표사진·이름 변경</div>
</footer>

<div id="tip" hidden></div>
<div id="toast" hidden></div>

<!-- Long-press context menu modal -->
<div id="ctxOverlay" class="modal-overlay" hidden>
  <div id="ctxCard" class="modal-card">
    <div id="ctxTitle" class="modal-title"></div>
    <div id="ctxSub" class="modal-sub"></div>
    <div id="ctxRenameBox" class="rename-box" hidden>
      <input id="ctxRenameInput" type="text" placeholder="새 표시 이름 입력">
      <button type="button" id="ctxRenameSave" class="primary-btn">저장</button>
    </div>
    <div id="ctxActions" class="ctx-actions"></div>
    <button type="button" id="ctxCancel" class="ctx-cancel">닫기</button>
  </div>
</div>

<!-- Representative photo picker modal -->
<div id="repOverlay" class="modal-overlay" hidden>
  <div id="repCard" class="modal-card rep-card">
    <div class="rep-header">
      <div>
        <div id="repTitle" class="modal-title">대표 사진 선택</div>
        <div id="repSub" class="modal-sub">원하는 사진을 탭하면 폴더 대표 원 이미지로 적용됩니다</div>
      </div>
      <button type="button" id="repClose" class="vbtn vbtn-close">✕ 닫기</button>
    </div>
    <div id="repGrid" class="rep-grid"></div>
  </div>
</div>

<!-- Fullscreen photo viewer -->
<div id="viewer" hidden>
  <button type="button" id="vcloseTop" class="vclose-top" title="닫기 (Esc)">✕</button>
  <img id="vimg" alt="">
  <button type="button" id="vprev" class="vnav" title="이전 (←)">‹</button>
  <button type="button" id="vnext" class="vnav" title="다음 (→)">›</button>
  <div id="vbottom">
    <div id="vinfo"></div>
    <div id="vtools">
      <button type="button" id="vorig" class="vbtn" title="원본 파일 열기">📂 원본 열기</button>
      <button type="button" id="vsetRep" class="vbtn" title="현재 폴더의 대표 사진으로 지정">⭐ 대표사진 지정</button>
      <button type="button" id="vclose" class="vbtn vbtn-close" title="닫기 (Esc)">✕ 닫기</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
